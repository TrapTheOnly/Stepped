name: Build And Release APK

on:
  push:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-release-apk:
    environment: Main
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build release APK
      env:
        GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        STEPPED_API_BASE_URL: ${{ vars.STEPPED_API_BASE_URL }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
      run: |
        flutter build apk --release \
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
          --dart-define=STEPPED_API_BASE_URL="$STEPPED_API_BASE_URL" \
          --dart-define=GEMINI_MODEL="$GEMINI_MODEL" \
          --dart-define=GEMINI_API_VERSION="$GEMINI_API_VERSION"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error

    - name: Compute release metadata
      id: meta
      run: |
        short_sha="${GITHUB_SHA::7}"
        tag="apk-${GITHUB_RUN_NUMBER}-${short_sha}"
        name="APK build #${GITHUB_RUN_NUMBER} (${short_sha})"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "name=${name}" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.name }}
        generate_release_notes: true
        files: build/app/outputs/flutter-apk/app-release.apk
