name: stepped
description: Stepped - a minimal Material 3 travel tracking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dynamic_color: ^1.7.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  file_picker: ^8.1.7
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/countries.geojson
    - assets/data/countries_200m.geojson
    - assets/data/countries_110m.geojson
    - assets/flags/
